schema_version = 1
network = "Murlocs"
protocol = ".murlocs/PROTOCOL.md"
max_active_bytes = 24576
owners = ["@lbliii"]

[policies]
require_scope_invariants = false
require_layer_owners = true
validate_codeowners = true

[[layers]]
id = "repo-base"
kind = "base"
path = ".murlocs/layers/base.toml"
owners = ["@lbliii"]

[[layers]]
id = "core"
kind = "domain"
path = ".murlocs/layers/core.toml"
owners = ["@lbliii"]

[[layers]]
id = "tests"
kind = "domain"
path = ".murlocs/layers/tests.toml"
owners = ["@lbliii"]

[[layers]]
id = "bootstrap-skill"
kind = "domain"
path = ".murlocs/layers/bootstrap-skill.toml"
owners = ["@lbliii"]
