[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "murlocs"
version = "0.1.0"
description = "Compile and verify repository-local guidance maps for coding agents."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Lawrence Lane" }]
keywords = ["coding-agents", "AGENTS.md", "repository-guidance", "verification", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["milo-cli>=0.4.2,<0.5"]

[project.scripts]
murlocs = "murlocs.cli:main"
mrr = "murlocs.cli:mrr"
murlocs-copilot-adapter = "murlocs.copilot_adapter:main"
murlocs-claude-adapter = "murlocs.claude_adapter:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/murlocs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
