name: Docs site

# Builds the Markdown under docs/ into a MkDocs Material site and publishes it to
# GitHub Pages. The build runs under `--strict`, so a broken internal link or a
# page missing from the nav fails here instead of shipping a broken site.
#
# Pages must be enabled once in the repository settings (Settings -> Pages ->
# Build and deployment -> Source: GitHub Actions) before the deploy step can
# succeed. Until then the build job still runs and catches doc regressions.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# deploy-pages needs pages:write and id-token:write; the build only reads.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; do not cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          prune-cache: true

      - name: Build MkDocs site (strict)
        run: uvx --with mkdocs-material==9.7.7 mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    # Only publish from main; pushes to other branches still build above.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
