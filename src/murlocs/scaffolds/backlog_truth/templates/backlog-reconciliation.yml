name: Backlog reconciliation

# Sweep that re-derives backlog truth from merged PRs + acceptance coverage and
# reports graph/workability drift. Prefer running on merge (continuous) once the
# engine lands; the scheduled + manual stub keeps day-one wiring valid.
# See docs/backlog-automation.md.
#
# Stub wiring: scripts/reconcile_backlog.py ships read-only. Full derive/apply
# behaviour lands via backlog-truth reconcile work (#208).

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply derived labels (uncheck for a dry-run report only)"
        type: boolean
        default: false
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  reconcile:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Reconcile backlog (read-only stub)
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        run: |
          ARGS="--report"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          python scripts/reconcile_backlog.py $ARGS | tee backlog-report.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload backlog receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backlog-reconciliation-${{ github.run_id }}
          path: backlog-report.md
          if-no-files-found: ignore
